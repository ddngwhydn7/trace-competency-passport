<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE — Competency Passport System</title>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-main: #f8fafc;
            --sidebar-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding: 0 8px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-text h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-text p {
            font-size: 11px;
            color: #94a3b8;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius);
            transition: all 0.2s ease;
        }

        .nav-number{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#94a3b8;flex:none}.nav-item.active .nav-number{background:rgba(255,255,255,.16);color:#fff}.passport-nav{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}

        .nav-item a:hover, .nav-item.active a {
            background-color: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .nav-item.active a {
            background-color: var(--primary-light);
            color: #fff;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
        }

        .user-info h4 {
            font-size: 13px;
            font-weight: 600;
        }

        .user-info p {
            font-size: 11px;
            color: #94a3b8;
        }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .header-title {
            margin-bottom: 24px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* --- DASHBOARD GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .badge {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
        }

        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        /* Career Gap List */
        .target-selector {
            margin-bottom: 20px;
        }

        .target-selector label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .select-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
        }

        .competency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .competency-item:last-child {
            border-bottom: none;
        }

        .action-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-light);
        }

        /* Passport Evidence */
        .passport-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .passport-box {
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .passport-box h5 {
            font-size: 13px;
            font-weight: 600;
        }

        .passport-box p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .evidence-list {
            list-style: none;
        }

        .evidence-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
    
/* --- TRACE INTERACTIVE EXTENSION --- */
label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin:12px 0 6px}
.text-input,.select-input{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none}
.text-input:focus,.select-input:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;gap:14px;align-items:center}
.stat-card b{display:block;font-size:24px}.stat-card span{font-size:11px;color:var(--text-muted)}
.stat-icon{width:42px;height:42px;border-radius:10px;background:#eff6ff;color:var(--primary-light);display:flex;align-items:center;justify-content:center}
.flow{display:flex;align-items:center;justify-content:space-between;gap:7px}.flow div{background:#eff6ff;color:var(--primary);border-radius:10px;padding:10px;text-align:center;font-weight:700;min-width:65px}.flow small{font-weight:500;font-size:10px}.flow span{color:#94a3b8}
.competency-item small,.list-card small,.evidence-item small{display:block;color:var(--text-muted);font-size:11px;margin-top:3px}
.list-card{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tags span{font-size:10px;padding:4px 7px;border-radius:12px;background:#eff6ff;color:#1e40af}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}.check-grid label{margin:0;font-weight:500;color:var(--text-main);font-size:12px}
.check-grid input{accent-color:var(--primary-light)}
.info-box{margin-top:16px;padding:12px;background:#eff6ff;color:#1e40af;border-radius:8px;font-size:11px;line-height:1.5}
.recommendation{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}.recommendation p{font-size:12px;color:var(--text-muted);margin:6px 0 10px}.recommendation button,.small-btn{border:0;background:#eff6ff;color:#1e40af;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:600;cursor:pointer}
.passport-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.passport-head h2{font-size:20px}.passport-head p{font-size:12px;color:var(--text-muted);margin-top:4px}
.section-label{font-size:13px;color:var(--text-muted);margin:20px 0 10px}.verified{color:var(--success);font-size:16px}
@media(max-width:900px){aside{width:210px}.stats-grid{grid-template-columns:1fr 1fr}.grid-container{grid-template-columns:1fr}}
@media(max-width:640px){body{display:block}aside{width:100%;min-height:auto}main{padding:18px}.stats-grid{grid-template-columns:1fr 1fr}.nav-menu{display:grid;grid-template-columns:1fr 1fr}.user-profile{margin-top:18px}}
@media print{aside{display:none}main{padding:0}.small-btn{display:none}.card{box-shadow:none}}

    

.trace-stage-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}.trace-stage{border:1px solid var(--border);background:#fff;border-radius:12px;padding:15px 13px;text-align:left;cursor:pointer;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.trace-stage:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(15,23,42,.08)}.trace-stage .stage-number{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.8px}.trace-stage b{display:block;font-size:15px;margin:7px 0 4px}.trace-stage small{display:block;color:var(--text-muted);font-size:10.5px;line-height:1.45}.trace-stage>i{align-self:flex-end;margin-top:10px;color:#94a3b8;font-size:12px}.stage-blue{background:#f8fbff;border-top:3px solid #3b82f6}.stage-green{background:#f8fffc;border-top:3px solid #10b981}.stage-orange{background:#fffaf5;border-top:3px solid #f59e0b}.stage-purple{background:#fbfaff;border-top:3px solid #8b5cf6}.stage-dark{background:#fafbfc;border-top:3px solid #334155}.passport-output{margin-top:14px;padding:15px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;display:flex;align-items:center;gap:13px;cursor:pointer}.passport-output>div:nth-child(2){flex:1}.passport-output b{display:block;font-size:14px;color:#1e3a8a}.passport-output small{display:block;color:#475569;font-size:11px;line-height:1.45;margin-top:4px}.passport-output-icon{width:42px;height:42px;border-radius:10px;background:#fff;color:#2563eb;display:grid;place-items:center;font-size:18px}.passport-output .download-btn{width:auto;margin:0;white-space:nowrap}
.dashboard-menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}.dashboard-menu{border:1px solid var(--border);background:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;transition:.2s}.dashboard-menu:hover{border-color:#93c5fd;transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.06)}.dashboard-menu>span:nth-child(2){flex:1}.dashboard-menu b{display:block;font-size:14px}.dashboard-menu small{display:block;color:var(--text-muted);font-size:11px;line-height:1.45;margin-top:4px}.menu-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:17px}.menu-icon.blue{background:#eff6ff;color:#2563eb}.menu-icon.green{background:#ecfdf5;color:#059669}.menu-icon.orange{background:#fff7ed;color:#ea580c}.menu-icon.purple{background:#f5f3ff;color:#7c3aed}.menu-icon.dark{background:#f1f5f9;color:#334155}.arrow{color:#94a3b8}.muted{color:var(--text-muted);font-size:11px;margin-top:4px}
.passport-actions{display:flex;gap:8px;flex-wrap:wrap}.download-btn{background:#1e3a8a;color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}.download-note{margin-top:10px;padding:11px 13px;border-radius:9px;background:#f8fafc;border:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.passport-document{max-width:820px;margin:0 auto;background:#fff;border:1px solid #cbd5e1;padding:42px;border-radius:4px;box-shadow:0 10px 30px rgba(15,23,42,.08)}.passport-document .doc-top{text-align:center;border-bottom:2px solid #1e3a8a;padding-bottom:20px}.passport-document .doc-kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64748b}.passport-document h2{font-size:27px;margin:8px 0 4px}.passport-document .doc-name{font-size:21px;font-weight:700}.passport-document .doc-sub{font-size:12px;color:#64748b;margin-top:4px}.doc-section{margin-top:22px}.doc-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#475569;margin-bottom:9px}.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.doc-chip{border:1px solid #e2e8f0;padding:10px;border-radius:7px}.doc-chip b{display:block;font-size:12px}.doc-chip span{font-size:10px;color:#64748b}.doc-evidence{border-top:1px solid #e2e8f0;padding:9px 0;font-size:11px}.doc-footer{margin-top:30px;padding-top:15px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:10px;color:#64748b}.passport-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.passport-modal.open{display:flex}.passport-modal-inner{background:#f8fafc;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:12px;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.small-close{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
@media(max-width:1000px){.trace-stage-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.dashboard-menu-grid{grid-template-columns:1fr}.trace-stage-grid{grid-template-columns:1fr 1fr}.passport-output{align-items:flex-start;flex-wrap:wrap}.passport-output .download-btn{margin-left:55px}.passport-document{padding:25px}.doc-grid{grid-template-columns:1fr}}
@media print{body{display:block;background:#fff}.passport-modal{position:static;background:#fff;display:block;padding:0}.passport-modal-inner{width:100%;max-height:none;padding:0}.modal-actions{display:none}.passport-document{box-shadow:none;border:0;max-width:none;border-radius:0}body>*:not(.passport-modal){display:none!important}}
</style>
</head>

<body>
<aside>
  <div>
    <div class="brand">
      <div class="brand-logo">T</div>
      <div class="brand-text"><h2>TRACE</h2><p>Competency Passport System</p></div>
    </div>
    <ul class="nav-menu">
      <li class="nav-item active"><a href="#dashboard" data-page="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
      <li class="nav-item"><a href="#track" data-page="track"><span class="nav-number">01</span> Track</a></li>
      <li class="nav-item"><a href="#recognize" data-page="recognize"><span class="nav-number">02</span> Recognize</a></li>
      <li class="nav-item"><a href="#align" data-page="align"><span class="nav-number">03</span> Align</a></li>
      <li class="nav-item"><a href="#connect" data-page="connect"><span class="nav-number">04</span> Connect</a></li>
      <li class="nav-item"><a href="#evidence" data-page="evidence"><span class="nav-number">05</span> Evidence</a></li>
      <li class="nav-item passport-nav"><a href="#passport" data-page="passport"><i class="fa-solid fa-id-card"></i> Competency Passport</a></li>
    </ul>
  </div>
  <div class="user-profile">
    <div class="avatar">DW</div>
    <div class="user-info"><h4>Dudung Wahyudin</h4><p>Mahasiswa PGSD</p></div>
  </div>
</aside>

<main>
  <div id="app"></div>
</main>

<script>
const state = {
  experiences: [
    {title:"Mengajar 15 Anak SD", type:"Pengalaman Mengajar", date:"2026", competencies:["Komunikasi","Pedagogi"], verified:true},
    {title:"Modul Pembelajaran Interaktif", type:"Proyek", date:"2026", competencies:["Digital Learning","Kreativitas"], verified:true}
  ],
  evidences: [
    {title:"Dokumentasi Mengajar 15 Anak SD", competency:"Komunikasi", validator:"Mentor/Pembimbing", verified:true},
    {title:"Modul Pembelajaran Interaktif", competency:"Digital Learning", validator:"Dosen/Mentor", verified:true}
  ],
  target:"Guru SD Era Digital"
};

const pages = {
  dashboard: {title:"Dashboard", subtitle:"Ringkasan perkembangan kompetensi dan aktivitas karier Anda."},
  track: {title:"Track", subtitle:"Catat pengalaman yang menjadi sumber data perkembangan kompetensi."},
  recognize: {title:"Recognize", subtitle:"Terjemahkan pengalaman menjadi kompetensi yang dapat dikenali."},
  align: {title:"Align", subtitle:"Selaraskan kompetensi yang dimiliki dengan target karier yang dipilih."},
  connect: {title:"Connect", subtitle:"Hubungkan career gap dengan aktivitas pengembangan yang relevan."},
  evidence: {title:"Evidence", subtitle:"Simpan dan validasi bukti yang mendukung kompetensi Anda."},
  passport: {title:"Competency Passport", subtitle:"Rekam perkembangan kompetensi berdasarkan pengalaman dan bukti terverifikasi."}
};

function go(page){
  location.hash = page;
  render(page);
}
function setActive(page){
  document.querySelectorAll(".nav-item").forEach(li => li.classList.remove("active"));
  const a = document.querySelector('[data-page="'+page+'"]');
  if(a) a.parentElement.classList.add("active");
}
function header(page){
  return `<div class="header-title"><h1>${pages[page].title}</h1><p>${pages[page].subtitle}</p></div>`;
}
function badge(text, cls="badge-success"){ return `<span class="badge ${cls}">${text}</span>`; }

function dashboard(){
  const verified = state.evidences.filter(e=>e.verified).length;
  return header("dashboard")+`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-briefcase"></i></div><div><b>${state.experiences.length}</b><span>Pengalaman tercatat</span></div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-folder-check"></i></div><div><b>${verified}</b><span>Bukti terverifikasi</span></div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div><div><b>2</b><span>Kompetensi dalam gap</span></div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-id-card"></i></div><div><b>4</b><span>Kompetensi terpetakan</span></div></div>
    </div>
    <div class="card menu-card-wrap">
      <div class="card-header"><div><h3 class="card-title">Menu TRACE</h3><p class="muted">Lima tahap TRACE mengubah pengalaman menjadi kompetensi yang selaras dengan karier dan didukung bukti.</p></div>${badge("5 Tahap")}</div>
      <div class="trace-stage-grid">
        <button class="trace-stage stage-blue" onclick="go('track')"><span class="stage-number">01</span><div><b>Track</b><small>Catat pengalaman, peran, kontribusi, dan aktivitas.</small></div><i class="fa-solid fa-arrow-right"></i></button>
        <button class="trace-stage stage-green" onclick="go('track')"><span class="stage-number">02</span><div><b>Recognize</b><small>Kenali kompetensi yang terbentuk dari pengalaman.</small></div><i class="fa-solid fa-arrow-right"></i></button>
        <button class="trace-stage stage-orange" onclick="go('align')"><span class="stage-number">03</span><div><b>Align</b><small>Selaraskan kompetensi dengan target karier.</small></div><i class="fa-solid fa-arrow-right"></i></button>
        <button class="trace-stage stage-purple" onclick="go('align')"><span class="stage-number">04</span><div><b>Connect</b><small>Hubungkan career gap dengan aktivitas pengembangan.</small></div><i class="fa-solid fa-arrow-right"></i></button>
        <button class="trace-stage stage-dark" onclick="go('evidence')"><span class="stage-number">05</span><div><b>Evidence</b><small>Simpan dan validasi bukti kompetensi.</small></div><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="passport-output" onclick="go('passport')">
        <div class="passport-output-icon"><i class="fa-solid fa-id-card"></i></div>
        <div><b>Competency Passport</b><small>Keluaran utama TRACE: rekam kompetensi yang diperbarui berdasarkan pengalaman dan bukti terverifikasi.</small></div>
        <button class="download-btn" type="button" onclick="event.stopPropagation();go('passport')"><i class="fa-solid fa-download"></i> Lihat & Unduh</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">Perkembangan Terbaru</h3></div>
      ${state.experiences.slice(-3).reverse().map(e=>`<div class="competency-item"><div><b>${e.title}</b><small>${e.type} · ${e.date}</small></div>${e.verified?badge("Terverifikasi"):badge("Belum diverifikasi","badge-warning")}</div>`).join("")}
    </div>`;
}

function track(){
  return header("track")+`
    <div class="grid-container">
      <div class="card">
        <div class="card-header"><h3 class="card-title">Tambah Pengalaman</h3><p class="muted">Tahap Track</p></div>
        <form onsubmit="addExperience(event)">
          <label>Nama pengalaman</label><input id="expTitle" class="text-input" placeholder="Contoh: Mengajar 15 Anak SD" required>
          <label>Jenis pengalaman</label><select id="expType" class="select-input"><option>Pengalaman Mengajar</option><option>Organisasi</option><option>Proyek</option><option>Volunteer</option><option>Magang</option></select>
          <label>Tahun</label><input id="expDate" class="text-input" value="2026" required>
          <label>Kompetensi yang ditunjukkan</label><div class="check-grid">
            <label><input type="checkbox" value="Komunikasi"> Komunikasi</label><label><input type="checkbox" value="Pedagogi"> Pedagogi</label>
            <label><input type="checkbox" value="Leadership"> Leadership</label><label><input type="checkbox" value="Digital Learning"> Digital Learning</label>
            <label><input type="checkbox" value="Kreativitas"> Kreativitas</label><label><input type="checkbox" value="Data Assessment"> Data Assessment</label>
          </div>
          <button class="action-btn" type="submit">Simpan Pengalaman</button>
        </form>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Experience Log</h3><p class="muted">Data pengalaman yang menjadi dasar tahap Recognize.</p>${badge(state.experiences.length+" tercatat")}</div>
        ${state.experiences.map((e,i)=>`<div class="list-card"><div><b>${e.title}</b><small>${e.type} · ${e.date}</small><div class="tags">${e.competencies.map(c=>`<span>${c}</span>`).join("")}</div></div>${badge("Terverifikasi")}</div>`).join("")}
      </div>
    </div>`;
}

function evidence(){
  return header("evidence")+`
    <div class="grid-container">
      <div class="card">
        <div class="card-header"><h3 class="card-title">Tambah Evidence</h3></div>
        <form onsubmit="addEvidence(event)">
          <label>Nama bukti</label><input id="evTitle" class="text-input" placeholder="Contoh: Sertifikat / Modul / Dokumentasi" required>
          <label>Kompetensi yang dibuktikan</label><select id="evComp" class="select-input"><option>Komunikasi</option><option>Pedagogi</option><option>Leadership</option><option>Digital Learning</option><option>Kreativitas</option><option>Data Assessment</option></select>
          <label>Validator</label><input id="evValidator" class="text-input" placeholder="Dosen / Mentor / Pembimbing" required>
          <button class="action-btn" type="submit">Simpan & Ajukan Validasi</button>
        </form>
        <div class="info-box"><i class="fa-solid fa-circle-info"></i> Validasi menguatkan keterkaitan antara bukti, kontribusi mahasiswa, dan kompetensi yang ditunjukkan.</div>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Evidence Vault</h3>${badge(state.evidences.length+" bukti")}</div>
        ${state.evidences.map(e=>`<div class="list-card"><div><b>${e.title}</b><small>${e.competency} · Validator: ${e.validator}</small></div>${e.verified?badge("Terverifikasi"):badge("Menunggu","badge-warning")}</div>`).join("")}
      </div>
    </div>`;
}

function recognize(){
  const mapping = [
    ["Komunikasi","Mengajar, menulis, dan berinteraksi dengan peserta didik"],
    ["Pedagogi","Pengalaman mengajar dan merancang pembelajaran"],
    ["Digital Learning","Pembuatan atau penggunaan media pembelajaran digital"],
    ["Kreativitas","Pengembangan modul, media, atau karya pembelajaran"],
    ["Leadership","Pengalaman memimpin kegiatan dan bekerja dalam tim"],
    ["Data Assessment","Pengalaman menggunakan atau mengembangkan asesmen"]
  ];
  return header("recognize")+`
    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Competency Mapping</h3><p class="muted">TRACE menerjemahkan pengalaman menjadi kompetensi berdasarkan peran, kontribusi, dan aktivitas yang dicatat.</p></div>${badge(mapping.filter(m=>state.experiences.some(e=>e.competencies.includes(m[0]))).length+" kompetensi terpetakan")}</div>
      ${mapping.map(([c,d])=>{const exps=state.experiences.filter(e=>e.competencies.includes(c)); return `<div class="list-card"><div><b>${c}</b><small>${d}</small><div class="tags">${exps.map(e=>`<span>${e.title}</span>`).join("") || '<span>Belum ada pengalaman</span>'}</div></div>${exps.length?badge("Teridentifikasi"):badge("Perlu dikembangkan","badge-warning")}</div>`}).join("")}
    </div>`;
}

function align(){
  const target=state.target;
  const rows = target==="Guru SD Era Digital"
    ? [["Komunikasi","Match"],["Pedagogi","Match"],["Leadership","Developing"],["Digital Learning","GAP"],["Data Assessment","GAP"]]
    : [["Komunikasi","Match"],["Kreativitas","Match"],["Digital Learning","Developing"],["Leadership","GAP"],["Data Assessment","GAP"]];
  return header("align")+`
    <div class="grid-container">
      <div class="card">
        <div class="card-header"><h3 class="card-title"><i class="fa-solid fa-bullseye"></i> Target Karier</h3></div>
        <label>Target Karier</label>
        <select class="select-input" onchange="state.target=this.value;render('align')">
          <option ${target==="Guru SD Era Digital"?"selected":""}>Guru SD Era Digital</option>
          <option ${target==="Pengembang Media Pembelajaran"?"selected":""}>Pengembang Media Pembelajaran</option>
        </select>
        <div class="info-box"><b>Align</b><br>Kompetensi yang telah dikenali dibandingkan dengan kompetensi yang relevan untuk target karier yang dipilih.</div>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Career Gap</h3>${badge(rows.filter(r=>r[1]==="GAP").length+" gap","badge-warning")}</div>
        ${rows.map(r=>`<div class="competency-item"><span><b>${r[0]}</b><small>Relevansi terhadap ${target}</small></span>${badge(r[1],r[1]==="GAP"?"badge-warning":"badge-success")}</div>`).join("")}
      </div>
    </div>`;
}

function connect(){
  return header("connect")+`
    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Development Recommendations</h3><p class="muted">Connect mengarahkan gap kompetensi pada pengalaman pengembangan berikutnya.</p></div>${badge("2 Rekomendasi")}</div>
      <div class="recommendation"><b>Digital Learning</b><p>Buat atau gunakan media pembelajaran digital sebagai proyek berikutnya, lalu catat pengalaman tersebut pada Track.</p><button onclick="go('track')">Catat Next Experience</button></div>
      <div class="recommendation"><b>Data Assessment</b><p>Ikuti pelatihan asesmen dan dokumentasikan penerapannya sebagai pengalaman pengembangan.</p><button onclick="go('track')">Catat Next Experience</button></div>
      <div class="info-box"><i class="fa-solid fa-rotate"></i> Setelah pengalaman baru diperoleh, data kembali ke Track untuk memperbarui Recognize dan Align.</div>
    </div>`;
}

function passport(){
  const comps = ["Communication","Pedagogy","Leadership","Digital Learning"];
  return header("passport")+`
    <div class="passport-head card"><div><h2>Dudung Wahyudin</h2><p>Competency Passport · Target: ${state.target}</p></div>${badge("Terverifikasi")}</div>
    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Competency Map</h3><p class="muted">Dokumen ini bukan sertifikat kelulusan, tetapi rekam kompetensi berbasis pengalaman dan bukti.</p></div><div class="passport-actions"><button class="download-btn" onclick="openPassportPreview()"><i class="fa-solid fa-download"></i> Unduh Competency Passport</button></div></div>
      <div class="passport-grid">
        ${comps.map((c,i)=>`<div class="passport-box"><h5>${c}</h5><p>${i<3? (i===0?"3 pengalaman":i===1?"2 pengalaman":"1 pengalaman")+" / Teruji":"0 pengalaman / Rekomendasi"}</p></div>`).join("")}
      </div>
      <h4 class="section-label">Evidence Utama</h4>
      <ul class="evidence-list">${state.evidences.map(e=>`<li class="evidence-item"><span><b>${e.title}</b><small>${e.competency} · ${e.validator}</small></span>${e.verified?'<i class="fa-solid fa-circle-check verified"></i>':badge("Menunggu","badge-warning")}</li>`).join("")}</ul>
      <div class="download-note"><i class="fa-solid fa-file-pdf"></i> Saat diunduh, TRACE menghasilkan format <b>Competency Passport</b> satu halaman yang tampil seperti dokumen kredensial/portfolio formal, bukan sertifikat penghargaan. Isinya identitas mahasiswa, target karier, peta kompetensi, dan bukti yang telah divalidasi.</div>
    </div>`;
}

function passportDocument(){
  const comps=["Communication","Pedagogy","Leadership","Digital Learning"];
  return `<div class="passport-document"><div class="doc-top"><div class="doc-kicker">TRACE · Competency Passport</div><h2>REKAM KOMPETENSI MAHASISWA</h2><div class="doc-name">Dudung Wahyudin</div><div class="doc-sub">Mahasiswa PGSD · Target Karier: ${state.target}</div></div><div class="doc-section"><h4>Competency Profile</h4><div class="doc-grid">${comps.map((c,i)=>`<div class="doc-chip"><b>${c}</b><span>${i<3? (i===0?"3 pengalaman":i===1?"2 pengalaman":"1 pengalaman")+" · Teruji":"Rekomendasi pengembangan"}</span></div>`).join("")}</div></div><div class="doc-section"><h4>Validated Evidence</h4>${state.evidences.map(e=>`<div class="doc-evidence"><b>${e.title}</b><br>${e.competency} · Validator: ${e.validator} · ${e.verified?"Terverifikasi":"Menunggu validasi"}</div>`).join("")}<div class="doc-footer"><span>Dihasilkan melalui platform TRACE</span><span>Dokumen rekam kompetensi · ${new Date().getFullYear()}</span></div></div></div>`;
}
function openPassportPreview(){
  const modal=document.createElement('div'); modal.className='passport-modal open'; modal.id='passportModal'; modal.innerHTML=`<div class="passport-modal-inner"><div class="modal-actions"><button class="small-close" onclick="closePassportPreview()">Tutup</button><button class="download-btn" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> Cetak / Simpan sebagai PDF</button></div>${passportDocument()}</div>`; document.body.appendChild(modal);
}
function closePassportPreview(){const m=document.getElementById('passportModal');if(m)m.remove();}


function addExperience(e){
  e.preventDefault();
  const comps=[...document.querySelectorAll('#experience input[type=checkbox]:checked')].map(x=>x.value);
  state.experiences.push({title:expTitle.value,type:expType.value,date:expDate.value,competencies:comps.length?comps:["Belum dipetakan"],verified:false});
  render("experience");
}
function addEvidence(e){
  e.preventDefault();
  state.evidences.push({title:evTitle.value,competency:evComp.value,validator:evValidator.value,verified:false});
  render("evidence");
}
function render(page){
  if(!pages[page]) page="dashboard";
  setActive(page);
  const content = {dashboard,track,recognize,align,connect,evidence,passport}[page]();
  document.getElementById("app").innerHTML=content;
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".nav-item a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.page)}));
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"dashboard"));
render(location.hash.slice(1)||"dashboard");
</script>
</body>

</html>
